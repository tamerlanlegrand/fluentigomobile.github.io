<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d7b8"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- soft city silhouette -->
  <g opacity="0.25" fill="#0B1220">
    <rect x="140" y="520" width="180" height="280" rx="20"/>
    <rect x="360" y="450" width="240" height="350" rx="20"/>
    <rect x="650" y="480" width="220" height="320" rx="20"/>
    <rect x="910" y="410" width="260" height="390" rx="20"/>
    <rect x="1210" y="500" width="250" height="300" rx="20"/>
  </g>
  <rect y="0" width="1600" height="900" fill="url(#haze)"/>
  <text x="90" y="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="96" font-weight="900" fill="#0B1220" opacity="0.18">Berlin</text>
</svg>
