<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e8ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g fill="#0B1220" opacity="0.12">
    <rect x="160" y="520" width="230" height="280" rx="20"/>
    <rect x="430" y="480" width="200" height="320" rx="20"/>
    <rect x="660" y="440" width="220" height="360" rx="20"/>
    <rect x="920" y="500" width="210" height="300" rx="20"/>
    <rect x="1170" y="460" width="270" height="340" rx="20"/>
    <!-- tiny "tower" hint -->
    <rect x="760" y="290" width="40" height="160" rx="16" opacity="0.22"/>
  </g>
  <rect width="1600" height="900" fill="url(#haze)"/>
  <text x="90" y="170" font-family="system-ui, -apple-system, Segoe UI, Roboto, Arial" font-size="96" font-weight="900" fill="#0B1220" opacity="0.18">Paris</text>
</svg>
