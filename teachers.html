<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fluentigo — учителя</title>
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./mobile-fixes.css" />

  <style>
    /* ✅ КЛЮЧЕВАЯ ПРАВКА: hidden теперь реально прячет модалку */
    .modal-backdrop[hidden]{ display:none !important; }

    .modal-backdrop{
      position: fixed;
      inset: 0;
      background: rgba(11,18,32,.45);
      display: grid;
      place-items: center;
      padding: 18px;
      z-index: 9999;
    }
    .modal{
      width: min(560px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(11,18,32,.10);
      background: rgba(255,255,255,.98);
      box-shadow: 0 22px 60px rgba(0,0,0,.25);
      padding: 18px;
    }
    .modal-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin-bottom: 10px;
    }
    .modal-top h2{ margin:0; }
    .modal-actions{
      display:flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .icon-btn{
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid rgba(11,18,32,.12);
      background: rgba(234,246,255,.60);
      cursor:pointer;
      font-weight: 900;
    }
    .icon-btn:hover{ background: rgba(234,246,255,.95); }
    .icon{ width: 22px; height: 22px; display:block; }

    .success{
      display:flex;
      align-items:flex-start;
      gap:12px;
      margin-top: 6px;
    }
    .success-badge{
      width: 40px;
      height: 40px;
      border-radius: 14px;
      display:grid;
      place-items:center;
      border: 1px solid rgba(11,18,32,.12);
      background: rgba(45,124,196,.16);
      flex: 0 0 auto;
    }
    .success-badge svg{ width:22px; height:22px; }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="container topbar-row">
      <a class="brand" href="./index.html" aria-label="Fluentigo">
        <span class="brand-dot"></span>
        <span class="brand-name" id="siteName">Fluentigo</span>
      </a>

      <!-- Desktop: inline. Mobile: turns into a right-side drawer (see styles.css) -->
      <div class="topbar-actions" aria-label="Меню">
        <nav class="nav" aria-label="Навигация">
          <a id="backToLang" href="./index.html#languages" data-i18n="nav_back">Назад</a>
          <a href="./index.html#about" data-i18n="nav_about">Кто мы?</a>
          <a href="./index.html#pricing" data-i18n="nav_pricing">Расценки</a>
          <a href="./index.html#contact" data-i18n="nav_contact">Контакты</a>
        </nav>
        <div class="ui-switch" aria-label="Выбор языка интерфейса">
          <button class="ui-pill" id="uiRu" type="button" aria-pressed="true" title="Русский">
            <span class="flag-mini"><img src="./assets/flags/ru.svg" alt="RU"></span><span>RU</span>
          </button>
          <button class="ui-pill" id="uiUa" type="button" aria-pressed="false" title="Українська">
            <span class="flag-mini"><img src="./assets/flags/ua.svg" alt="UA"></span><span>UA</span>
          </button>
        </div>
      </div>

      <button class="menu-btn" type="button" aria-label="Открыть меню" aria-expanded="false">
        <span></span>
      </button>
    </div>
  </header>

  <div class="menu-backdrop" aria-hidden="true"></div>

  <main class="section">
    <div class="container">
      <div class="panel lang-header">
        <div class="lang-title">
          <div class="lang-flag big" id="langFlag">🏳️</div>
          <div>
            <h1 class="lang-h1" id="pageTitle">Учителя</h1>
            <p class="muted" id="pageSubtitle"></p>
          </div>
        </div>
        <a class="btn btn-ghost" id="backBtn" href="./index.html#languages">← Назад</a>
      </div>

      <div class="panel">
        <div class="teachers-head">
          <h2 id="teachersTitle">Подбор учителей</h2>
          <button class="btn btn-ghost" id="rerollBtn" type="button">Показать других</button>
        </div>

        <div class="teacher-grid" id="teacherGrid"></div>
        <p class="muted tiny" id="hint"></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-row">
      <div>
        <div class="muted" id="footerText"></div>
        <div class="footer-contacts" id="footerContacts"></div>
      </div>
      <span class="muted tiny">Fluentigo — Language School</span>
    </div>
  </footer>

  <!-- ✅ МОДАЛКА ИЗНАЧАЛЬНО СКРЫТА -->
  <div id="modalBackdrop" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-top">
        <h2 id="modalTitle">Связаться</h2>
        <button class="btn btn-ghost" id="modalClose" type="button" aria-label="Закрыть">✕</button>
      </div>
      <p class="muted" id="modalText"></p>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function el(tag, attrs = {}, children = []) {
      const n = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'class') n.className = v;
        else n.setAttribute(k, v);
      }
      for (const c of children) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      return n;
    }

    function applyTheme(theme) {
      const r = document.documentElement;
      const bgImage = theme.backgroundImage ? `url("${theme.backgroundImage}")` : 'none';
      r.style.setProperty('--page-bg', theme.pageBg);
      r.style.setProperty('--page-bg-image', bgImage);
      r.style.setProperty('--text', theme.text);
      r.style.setProperty('--panel-bg', theme.panelBg);
      r.style.setProperty('--topbar-bg', theme.topbarBg);
      r.style.setProperty('--topbar-text', theme.topbarText);
    }

    
    // --- i18n helper: supports both plain strings and {ru,ua} objects in data.json
    function pick(v, ui=getUI()){
      if (v == null) return '';
      if (typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean') return String(v);
      if (Array.isArray(v)) return v.map(x => pick(x, ui));
      if (typeof v === 'object') return (v[ui] ?? v.ua ?? v.uk ?? v.ru ?? '');
      return String(v);
    }

function renderFooter(data) {
      $('footerText').textContent = pick(data.site.footerText);
      const fc = $('footerContacts');
      fc.innerHTML = '';
      (data.contact.items || []).forEach(i => {
        fc.appendChild(el('span', { class: 'footer-link' }, [`${pick(i.label)}: ${i.value}`]));
      });
      (data.contact.links || []).forEach(l => { fc.appendChild(makeSocialIcon(l, true)); });
    }

    function qp(name){ return new URL(location.href).searchParams.get(name); }

    function shuffle(arr){
      const a = [...arr];
      for (let i=a.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    const ICONS = {
      whatsapp: `<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7A8 8 0 0 1 20 12Z" stroke="currentColor" stroke-width="2"/><path d="M8 20l1-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M9.5 9.5c.4 2.2 2.8 4.6 5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`,
      telegram: `<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 4 3.7 10.7c-.9.4-.9 1.1-.2 1.3l4.5 1.4 1.7 5.2c.2.6.3.6.7.2l2.6-2.5 5 3.7c.9.5 1.5.2 1.7-.8L22 5.3c.2-1.1-.5-1.7-1-1.3Z" fill="currentColor"/></svg>`,
      instagram: `<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5" stroke="currentColor" stroke-width="2"/><path d="M8 12a4 4 0 1 0 8 0 4 4 0 0 0-8 0Z" stroke="currentColor" stroke-width="2"/><path d="M17.5 6.6h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
      facebook: `<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4v-3c0-.6.4-1 1-1Z" fill="currentColor"/></svg>`,
      email: `<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16v12H4V6Z" stroke="currentColor" stroke-width="2" /><path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    };


    function inferIconKey(link){
      const label = (link.label || '').toLowerCase();
      const url = (link.url || '').toLowerCase();
      if (url.startsWith('mailto:') || label.includes('email')) return 'email';
      if (label.includes('whatsapp')) return 'whatsapp';
      if (label.includes('telegram')) return 'telegram';
      if (label.includes('instagram')) return 'instagram';
      if (label.includes('facebook')) return 'facebook';
      return 'email';
    }
    function makeSocialIcon(link, isFooter=false){
      const key = inferIconKey(link);
      const a = el('a', {
        class: isFooter ? 'footer-link social-icon' : 'social-icon',
        href: link.url,
        target: '_blank',
        rel: 'noopener',
        title: link.label
      });
      a.innerHTML = ICONS[key] + `<span>${link.label}</span>`;
      return a;
    }

    function qp(name){ return new URL(location.href).searchParams.get(name); }
    function getUI(){ return qp('ui') || localStorage.getItem('ui') || 'ru'; }
    function setUI(ui){
      localStorage.setItem('ui', ui);
      $('uiRu').setAttribute('aria-pressed', ui==='ru' ? 'true':'false');
      $('uiUa').setAttribute('aria-pressed', ui==='ua' ? 'true':'false');
      document.documentElement.lang = ui==='ua' ? 'uk' : 'ru';
      const I={
        ru:{nav_back:'Назад',nav_about:'Кто мы?',nav_pricing:'Расценки',nav_contact:'Контакты',
            reroll:'Показать других',title:'Учителя',pick:'Подбор учителей'},
        ua:{nav_back:'Назад',nav_about:'Хто ми?',nav_pricing:'Ціни',nav_contact:'Контакти',
            reroll:'Показати інших',title:'Вчителі',pick:'Підбір вчителів'}
      };
      document.querySelectorAll('[data-i18n]').forEach(n=>{
        const k=n.getAttribute('data-i18n');
        if(I[ui] && I[ui][k]) n.textContent=I[ui][k];
      });
      const r = document.getElementById('rerollBtn');
      if (r) r.textContent = I[ui]?.reroll || r.textContent;
    }

    const LEVEL_ORDER = ['A1','A2','B1','B2','C1','C2'];
    function parseLevelRange(str){
      const s = (str || '').toUpperCase();
      const m = s.match(/(A1|A2|B1|B2|C1|C2)\s*[–-]\s*(A1|A2|B1|B2|C1|C2)/);
      if (!m) return null;
      return {min:m[1], max:m[2]};
    }
    function teacherMatchesLevel(t, level){
      if (!level) return true;
      if (Array.isArray(t.levels)) return t.levels.includes(level);
      const range = parseLevelRange(t.role || t.subtitle || '');
      if (!range) return true;
      const i = LEVEL_ORDER.indexOf(level);
      const a = LEVEL_ORDER.indexOf(range.min);
      const b = LEVEL_ORDER.indexOf(range.max);
      if (i<0 || a<0 || b<0) return true;
      return i>=a && i<=b;
    }


    let DATA = null;
    let LANG = null;
    let GOAL = null;
    let selectedTeacher = '';

    function openModal(){ $('modalBackdrop').hidden = false; }
    function closeModal(){ $('modalBackdrop').hidden = true; }

    function findLink(labelIncludes){
      return (DATA?.contact?.links || []).find(x => (x.label || '').toLowerCase().includes(labelIncludes));
    }

    function modalChoose(){
      $('modalTitle').textContent = getUI()==='ua' ? 'Звʼязатися' : 'Связаться';
      $('modalText').textContent = `${getUI()==='ua' ? 'Ви обрали викладача' : 'Вы выбрали учителя'}: ${selectedTeacher}. ${getUI()==='ua' ? 'Як зручно звʼязатися?' : 'Как удобно связаться?'}`;

      const actions = $('modalActions');
      actions.innerHTML = '';

      const links = (DATA?.contact?.links || []);
      const order = [
        {k:'whatsapp', label:'WhatsApp'},
        {k:'telegram', label:'Telegram'},
        {k:'instagram', label:'Instagram'},
        {k:'facebook', label:'Facebook'},
        {k:'email', label:'Email'}
      ];

      order.forEach(o=>{
        const l = links.find(x => inferIconKey(x)===o.k);
        if (!l) return;
        const btn = el('button', { class:'icon-btn', type:'button' });
        btn.innerHTML = ICONS[o.k] + `<span>${o.label}</span>`;
        btn.addEventListener('click', ()=> modalSuccess(o.label, l.url));
        actions.appendChild(btn);
      });

      const cancelBtn = el('button', { class: 'btn btn-ghost', type: 'button' }, [getUI()==='ua' ? 'Скасувати' : 'Отмена']);
      cancelBtn.addEventListener('click', closeModal);
      actions.appendChild(cancelBtn);

      openModal();
    }

    function modalSuccess(method, url){
      $('modalTitle').textContent = 'Всё отлично!';
      $('modalText').innerHTML = `
        <div class="success">
          <div class="success-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <path fill="currentColor" d="M9.2 16.6 4.9 12.3l1.4-1.4 2.9 2.9 8.5-8.5 1.4 1.4z"/>
            </svg>
          </div>
          <div>
            <div style="font-weight:900; margin-bottom:6px;">Мы свяжемся с вами в течение дня.</div>
            <div class="muted">Канал: ${method}. Спасибо!</div>
          </div>
        </div>
      `;

      const actions = $('modalActions');
      actions.innerHTML = '';

      if (url && url !== '#') {
        actions.appendChild(el('a', { class: 'btn', href: url, target: '_blank', rel: 'noopener' }, ['Открыть ' + method]));
      }

      const okBtn = el('button', { class: 'btn btn-ghost', type: 'button' }, ['Закрыть']);
      okBtn.addEventListener('click', closeModal);
      actions.appendChild(okBtn);
    }

    function renderTeachers(){
      const goalObj = LANG.goals.find(g => g.id === GOAL);
      const pool = (LANG.teachers || []).filter(t => (t.goals || []).includes(GOAL));
      const five = shuffle(pool).slice(0, 5);

      (function(){
        const lf = $('langFlag');
        lf.innerHTML='';
        if (typeof LANG.flag === 'string' && (LANG.flag.endsWith('.svg') || LANG.flag.endsWith('.png') || LANG.flag.endsWith('.jpg') || LANG.flag.endsWith('.webp'))){
          lf.appendChild(el('img', { class:'flag-img', src: LANG.flag, alt: pick(LANG.name) }));
        } else {
          lf.textContent = LANG.flag || '';
        }
      })();
      $('pageTitle').textContent = `${getUI()==='ua' ? 'Вчителі' : 'Учителя'} — ${pick(LANG.name)}`;
      $('pageSubtitle').textContent = goalObj ? pick(goalObj.title) : '';

      $('teachersTitle').textContent = `${getUI()==='ua' ? 'Вчителі' : 'Учителя'} — ${pick(LANG.name)} • ${goalObj ? pick(goalObj.title) : ''}`;
      $('hint').textContent = `${getUI()==='ua' ? 'Показано 5 викладачів за вашим запитом' : 'Показано 5 преподавателей по вашему запросу'}: ${goalObj ? pick(goalObj.title) : ''}.`;

      const grid = $('teacherGrid');
      grid.innerHTML = '';

      five.forEach(t => {
        const chooseBtn = el('button', { class: 'btn', type: 'button' }, ['Выбрать']);
        chooseBtn.addEventListener('click', () => {
          selectedTeacher = t.name;
          modalChoose();   // ✅ модалка только после клика
        });

        grid.appendChild(
          el('article', { class: 'teacher-card' }, [
            el('div', { class: 'teacher-top' }, [
              (function(){
              const photo = t.photo || t.photoUrl || t.image || './assets/teachers/placeholder.webp';
              const a = el('div', { class: 'avatar' }, []);
              const img = el('img', { src: photo, alt: t.name, loading: 'lazy' }, []);
              const initials = el('span', { class: 'initials' }, [t.initials || '']);
              img.addEventListener('load', () => { a.classList.add('has-photo'); });
              img.addEventListener('error', () => {
                img.src = './assets/teachers/placeholder.webp';
                a.classList.add('has-photo');
              });
              a.appendChild(img);
              a.appendChild(initials);
              return a;
            })(),
              el('div', {}, [
                el('div', { class: 'teacher-name' }, [t.name]),
                el('div', { class: 'muted tiny' }, [pick(t.role)])
              ])
            ]),
            el('p', { class: 'text' }, [pick(t.bio)]),
            el('ul', { class: 'meta' }, [
              el('li', {}, [`Опыт: ${t.experienceYears} лет`]),
              el('li', {}, [`Фокус: ${t.focus.join(', ')}`]),
              el('li', {}, [`Формат: ${pick(t.format)}`])
            ]),
            el('div', { style: 'margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;' }, [chooseBtn])
          ])
        );
      });
    }

    (async function init(){
      const res = await fetch('./data.json', { cache: 'no-store' });
      DATA = await res.json();

      // Load teachers from separate JSON (editable)
      let ALL_TEACHERS = [];
      try {
        const tr = await fetch('./teachers.json', { cache: 'no-store' });
        if (tr.ok) ALL_TEACHERS = await tr.json();
      } catch(e) { /* ignore */ }

      // Attach teachers to languages by lang id
      if (Array.isArray(DATA.languages) && Array.isArray(ALL_TEACHERS)) {
        DATA.languages.forEach(L => {
          L.teachers = ALL_TEACHERS.filter(t => {
            const langs = t.langs || (t.lang ? [t.lang] : []);
            return langs.includes(L.id);
          });
        });
      }

      $('siteName').textContent = DATA.site.name;
      renderFooter(DATA);

      const langId = qp('lang');
      GOAL = qp('goal');
      LANG = DATA.languages.find(x => x.id === langId);

      if (!LANG || !GOAL) {
        applyTheme(DATA.site.defaultTheme);
        $('teachersTitle').textContent = 'Неверная ссылка';
        $('hint').textContent = 'Вернитесь и выберите язык/цель заново.';
        return;
      }

      applyTheme(LANG.theme);
      document.title = `${DATA.site.name} — ${LANG.name}`;

      $('backBtn').href = `./language.html?lang=${encodeURIComponent(LANG.id)}`;
      $('backToLang').href = `./language.html?lang=${encodeURIComponent(LANG.id)}`;

      // ✅ гарантированно скрываем модалку на входе
      closeModal();

      renderTeachers();
      $('rerollBtn').addEventListener('click', renderTeachers);

      $('modalClose').addEventListener('click', closeModal);
      $('modalBackdrop').addEventListener('click', (e) => {
        if (e.target === $('modalBackdrop')) closeModal();
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
      });
    })().catch(console.error);
  </script>

  <script src="./mobile-nav.js"></script>
</body>
</html>
